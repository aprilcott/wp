        <main class="section-container">
            <div class="container-xl">
                <div class="row">
                    <div class="col">
                        <h1 class="baskervville-headings">
                        Add New Skill
                        </h1>
                    </div>
                </div>
                <section>
            <form>
                <div class="form-group add-form">
                    <label>Title*</label>
                        <input type="name" class="form-control" placeholder="Enter Skill Title">
                    <label>Description</label>
                        <textarea type="description" class="form-control" rows="5" placeholder="Enter Description"></textarea>
                    <label>Category</label>
                    <select class="form-control" placeholder="Enter Skill Category">
                        <option selected>Enter Skill Category</option>
                        <option value="1">Just wanted to chit chat</option>
                        <option value="2">Website details</option>
                        <option value="3">Request</option>
                    </select>
                    <label>Rate Per Hour ($)</label>
                        <input type="name" class="form-control" placeholder="Enter Rate Per Hour">
                    <label>Description</label>
                    <select class="form-control" placeholder="Level*">
                        <option selected>Please Select</option>
                        <option value="1">Just wanted to chit chat</option>
                        <option value="2">Website details</option>
                        <option value="3">Request</option>
                    </select>
                    <label>Skill Image*</label>
                    <input type="file" class="form-control" placeholder="No File Chosen">
                    </div>
                <button type="submit" class="btn btn-secondary btn-block btn-primary ysabeau-sc-orange-button rounded-pill">
                    <label>Submit</label>
                </button>
            </form>
        </section>
